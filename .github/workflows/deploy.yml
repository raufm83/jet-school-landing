name: Deploy to Droplet

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy Full Stack Application
    runs-on: ubuntu-latest

    steps: 
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          ssh-keyscan -H ${{ secrets.DROPLET_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy Application
        run: |
          ssh -o ServerAliveInterval=60 -o ServerAliveCountMax=30 -i ~/.ssh/id_ci ${{ secrets.DROPLET_USER }}@${{ secrets.DROPLET_HOST }} <<'EOF'
          set -e

          cd /root/jetschool

          echo "🔄 Pulling s latest changes..."
          git fetch origin main
          git reset --hard origin/main

          echo "📁 Ensuring uploads directory exists..."
          mkdir -p ~/uploads

          cd /root/jetschool

          export DOCKER_CLIENT_TIMEOUT=600
          export COMPOSE_HTTP_TIMEOUT=600

          echo "🔧 Optimizing system for deployment..."
          # Clear Docker cache to free up space
          docker system prune -f || true

          # Check available memory
          echo "💾 Available memory:"
          free -h

          # Ensure swap is available for builds
          if ! sudo swapon --show | grep -q '/swapfile'; then
            echo "🔄 Creating swap file for build process..."
            sudo fallocate -l 2G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
            sudo chmod 600 /swapfile
            sudo mkswap /swapfile
            sudo swapon /swapfile
            echo '/swapfile none swap sw 0 0' | sudo tee -a /etc/fstab
          else
            echo "🔁 Swapfile already active"
          fi

          echo "🔨 Building and starting backend API..."
          timeout 600 docker compose build --no-cache api || exit 1
          docker compose up -d api

          echo "🩺 API cavab yoxlaması (127.0.0.1:3001 → konteyner 3002)..."
          API_UP=0
          for i in {1..6}; do
            if curl -sfS --max-time 5 http://127.0.0.1:3001/api >/dev/null; then
              API_UP=1
              break
            fi
            echo "Gözləyirik... ($i/6)"
            sleep 5
          done

          if [ $API_UP -eq 0 ]; then
            echo "❌ API cavab vermir. nest-app logları:"
            docker logs nest-app --tail 200 2>&1 || true
            exit 1
          fi
          echo "✅ API cavab verir"

          echo "📁 Verifying uploads are mounted..."
          echo "Uploads directory contents:"
          ls -la ~/uploads/ || echo "Uploads directory is empty or doesn't exist"
          echo "Uploads in container:"
          docker exec nest-app ls -la /app/uploads/ || echo "No uploads directory in container"

          echo "🔨 Building and starting frontend..."
          # Set Docker BuildKit for optimized builds
          export DOCKER_BUILDKIT=1
          export COMPOSE_DOCKER_CLI_BUILD=1

          timeout 1200 docker compose build --no-cache client || exit 1
          docker compose up -d client

          echo "✅ Deployment complete!"
          EOF
