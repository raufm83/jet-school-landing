# ─────────────────────────────────────────────────────────────────────────────
# HTTP (port 80) — bütün domenləri HTTPS-ə yönləndir + Let's Encrypt challenge
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name jetschool.az www.jetschool.az api.jetschool.az;

    # Let's Encrypt ACME challenge (certbot renewal üçün lazımdır)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # www → non-www HTTPS
    if ($host = www.jetschool.az) {
        return 301 https://jetschool.az$request_uri;
    }

    # Hər şeyi HTTPS-ə yönləndir
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS www.jetschool.az → https://jetschool.az (daimi yönləndirmə)
# NOT: Bu blok üçün sertifikat www-ni əhatə etməlidir.
#      Aşağıdakı certbot əmrini serverda işə salın:
#
#  certbot certonly --webroot -w /var/www/certbot \
#    -d jetschool.az -d www.jetschool.az -d api.jetschool.az --expand
#
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name www.jetschool.az;

    ssl_certificate     /etc/letsencrypt/live/jetschool.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jetschool.az/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # www-ni həmişə non-www HTTPS-ə yönləndir
    return 301 https://jetschool.az$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS jetschool.az — əsas frontend
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name jetschool.az;

    ssl_certificate     /etc/letsencrypt/live/jetschool.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jetschool.az/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: brauzerlərə 1 il HTTPS-i məcburi etdir (ilk düzgün yükdən sonra)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Next.js (Docker host port)
    location / {
        proxy_pass         http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }

    # Front domenindən gələn /api/ çağırışlarını backend-ə ötür
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Origin            $http_origin;

        client_max_body_size 50M;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
        proxy_connect_timeout 30s;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS api.jetschool.az — backend API
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.jetschool.az;

    ssl_certificate     /etc/letsencrypt/live/jetschool.az/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jetschool.az/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers   ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # API endpoint-ləri
    location /api/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header Origin            $http_origin;

        client_max_body_size 50M;
        proxy_read_timeout   120s;
        proxy_send_timeout   120s;
        proxy_connect_timeout 30s;
    }

    # Şəkillər ( /uploads/** )
    location /uploads/ {
        proxy_pass         http://127.0.0.1:3001;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin  * always;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
